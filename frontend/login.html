<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - ShopEase</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body style="background:#f3f4f6;">

<nav class="navbar navbar-shopease py-3">
  <div class="container">
    <a class="navbar-brand brand-logo" href="index.html"><i class="fa-solid fa-bag-shopping"></i> Shop<span>Ease</span></a>
  </div>
</nav>

<div class="auth-card">
  <h3 class="fw-bold text-center mb-1">Welcome Back</h3>
  <p class="text-center text-muted mb-4">Login to continue shopping</p>

  <div id="loginAlert" class="alert alert-danger d-none"></div>

  <form id="loginForm" novalidate>
    <div class="mb-3">
      <label class="form-label">Email Address</label>
      <input type="email" class="form-control" id="email" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Password</label>
      <input type="password" class="form-control" id="password" required>
    </div>
    <div class="form-check mb-3">
      <input class="form-check-input" type="checkbox" id="rememberMe" checked>
      <label class="form-check-label" for="rememberMe">Remember me</label>
    </div>
    <button type="submit" class="btn btn-brand w-100 py-2" id="loginBtn">Login</button>
  </form>

  <p class="text-center mt-3 mb-1">Don't have an account? <a href="register.html" class="fw-semibold">Register here</a></p>
  <p class="text-center small text-muted">Admin demo login: admin@shopease.com / Admin@123</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/cart.js"></script>
<script src="js/auth.js"></script>
<script src="js/login.js"></script>
</body>
</html>
