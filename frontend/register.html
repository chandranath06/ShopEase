<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - ShopEase</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body style="background:#f3f4f6;">

<nav class="navbar navbar-shopease py-3">
  <div class="container">
    <a class="navbar-brand brand-logo" href="index.html"><i class="fa-solid fa-bag-shopping"></i> Shop<span>Ease</span></a>
  </div>
</nav>

<div class="auth-card">
  <h3 class="fw-bold text-center mb-1">Create Your Account</h3>
  <p class="text-center text-muted mb-4">Join ShopEase and start shopping smart</p>

  <div id="registerAlert" class="alert d-none"></div>

  <form id="registerForm" novalidate>
    <div class="mb-3">
      <label class="form-label">Full Name</label>
      <input type="text" class="form-control" id="name" required>
      <div class="invalid-feedback">Please enter your name.</div>
    </div>
    <div class="mb-3">
      <label class="form-label">Email Address</label>
      <input type="email" class="form-control" id="email" required>
      <div class="invalid-feedback">Please enter a valid email address.</div>
    </div>
    <div class="mb-3">
      <label class="form-label">Password</label>
      <input type="password" class="form-control" id="password" minlength="6" required>
      <div class="password-strength-bar"><div id="strengthFill"></div></div>
      <small class="text-muted" id="strengthLabel">Minimum 6 characters</small>
      <div class="invalid-feedback">Password must be at least 6 characters.</div>
    </div>
    <div class="mb-3">
      <label class="form-label">Confirm Password</label>
      <input type="password" class="form-control" id="confirmPassword" required>
      <div class="invalid-feedback">Passwords do not match.</div>
    </div>
    <button type="submit" class="btn btn-brand w-100 py-2" id="registerBtn">Register</button>
  </form>

  <p class="text-center mt-3 mb-0">Already have an account? <a href="login.html" class="fw-semibold">Login here</a></p>
</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/cart.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui-helpers.js"></script>
<script src="js/register.js"></script>
</body>
</html>
