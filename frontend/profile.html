<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile - ShopEase</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-shopease sticky-top py-3">
  <div class="container">
    <a class="navbar-brand brand-logo" href="index.html"><i class="fa-solid fa-bag-shopping"></i> Shop<span>Ease</span></a>
    <div class="d-flex align-items-center gap-3 ms-auto">
      <div id="navbarAuthSlot"></div>
      <a href="cart.html" class="cart-icon-wrap"><i class="fa-solid fa-cart-shopping"></i><span id="cartCount">0</span></a>
    </div>
  </div>
</nav>

<div class="container py-4">
  <h2 class="section-title">My Profile</h2>
  <div class="row justify-content-center">
    <div class="col-lg-6">
      <div class="summary-box">
        <div id="profileAlert" class="alert d-none"></div>
        <form id="profileForm">
          <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" class="form-control" id="profName" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" id="profEmail" disabled>
            <small class="text-muted">Email cannot be changed.</small>
          </div>
          <div class="mb-3">
            <label class="form-label">Phone</label>
            <input type="tel" class="form-control" id="profPhone">
          </div>
          <div class="mb-3">
            <label class="form-label">Street Address</label>
            <input type="text" class="form-control" id="profStreet">
          </div>
          <div class="row g-2 mb-3">
            <div class="col-md-4"><input type="text" class="form-control" id="profCity" placeholder="City"></div>
            <div class="col-md-4"><input type="text" class="form-control" id="profState" placeholder="State"></div>
            <div class="col-md-4"><input type="text" class="form-control" id="profPincode" placeholder="PIN Code"></div>
          </div>
          <button type="submit" class="btn btn-brand w-100 py-2">Save Changes</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/cart.js"></script>
<script src="js/auth.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
