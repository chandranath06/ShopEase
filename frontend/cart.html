<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Cart - ShopEase</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-shopease sticky-top py-3">
  <div class="container">
    <a class="navbar-brand brand-logo" href="index.html"><i class="fa-solid fa-bag-shopping"></i> Shop<span>Ease</span></a>
    <div class="d-flex align-items-center gap-3 ms-auto">
      <div id="navbarAuthSlot"></div>
      <a href="cart.html" class="cart-icon-wrap">
        <i class="fa-solid fa-cart-shopping"></i>
        <span id="cartCount">0</span>
      </a>
    </div>
  </div>
</nav>

<div class="container py-4">
  <h2 class="section-title">Your Shopping Cart</h2>

  <div class="row">
    <div class="col-lg-8">
      <div id="cartItemsContainer"></div>
      <div class="d-flex justify-content-between mt-3">
        <a href="products.html" class="btn btn-outline-brand"><i class="fa-solid fa-arrow-left"></i> Continue Shopping</a>
        <button class="btn btn-outline-secondary" id="clearCartBtn"><i class="fa-solid fa-trash"></i> Clear Cart</button>
      </div>
    </div>

    <div class="col-lg-4 mt-4 mt-lg-0">
      <div class="summary-box">
        <h5 class="fw-bold mb-3">Order Summary</h5>
        <div class="d-flex justify-content-between mb-2"><span>Items (<span id="summaryQty">0</span>)</span><span id="summarySubtotal">₹0</span></div>
        <div class="d-flex justify-content-between mb-2"><span>Shipping</span><span id="summaryShipping">₹0</span></div>
        <div class="d-flex justify-content-between mb-2 text-success"><span>Discount</span><span id="summaryDiscount">-₹0</span></div>
        <hr>
        <div class="d-flex justify-content-between fw-bold fs-5 mb-3"><span>Total</span><span id="summaryTotal">₹0</span></div>
        <button class="btn btn-brand w-100 py-2" id="checkoutBtn">Proceed to Checkout <i class="fa-solid fa-arrow-right ms-1"></i></button>
        <p class="small text-muted mt-2 mb-0">Free shipping on orders above ₹999.</p>
      </div>
    </div>
  </div>
</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/cart.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui-helpers.js"></script>
<script src="js/cart-page.js"></script>
</body>
</html>
